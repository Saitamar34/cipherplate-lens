name: Build iOS Companion (CipherPlate Lens)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Installation de Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Initialisation du projet iOS Xcode
        run: cargo tauri ios init --ci

      - name: Compilation iOS via Tauri CLI
        run: |
          # Construction de l'app iOS native en mode debug non signé (prêt pour Sideloadly / AltStore)
          cargo tauri ios build --ci --debug -- CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

      - name: Empaquetage du binaire IPA
        run: |
          echo "=== Recherche de l'application .app ==="
          APP_DIR=$(find gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          echo "Application trouvée : $APP_DIR"
          if [ -n "$APP_DIR" ]; then
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r CipherPlate-Lens.ipa Payload
            echo "Package IPA généré avec succès :"
            ls -lh CipherPlate-Lens.ipa
          else
            echo "ERREUR : Aucun dossier .app trouvé."
            find gen/apple -maxdepth 4 || true
            exit 1
          fi

      - name: Archivage du fichier IPA pour iPhone
        uses: actions/upload-artifact@v4
        with:
          name: CipherPlate-Lens-iOS
          path: CipherPlate-Lens.ipa
          if-no-files-found: error
