name: Build iOS Companion (CipherPlate Lens)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Installation de Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Initialisation du projet iOS Xcode (Non-interactif)
        run: |
          cargo tauri ios init --ci
          ls -la gen/apple

      - name: Compilation iOS & Création de l'application (.app)
        run: |
          PROJ=$(find gen/apple -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}')
          echo "Projet Xcode : $PROJ, Schéma : $SCHEME"
          
          # Compilation non signée pour déploiement Sideloadly / AltStore
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetage du binaire IPA
        run: |
          APP_DIR=$(find ./derived_data -name "*.app" -type d | head -n 1)
          echo "Application trouvée : $APP_DIR"
          if [ -n "$APP_DIR" ]; then
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r CipherPlate-Lens.ipa Payload
            echo "IPA généré avec succès :"
            ls -lh CipherPlate-Lens.ipa
          else
            echo "ERREUR: Aucun dossier .app trouvé dans derived_data"
            exit 1
          fi

      - name: Archivage du fichier IPA pour iPhone
        uses: actions/upload-artifact@v4
        with:
          name: CipherPlate-Lens-iOS
          path: CipherPlate-Lens.ipa
          if-no-files-found: error
